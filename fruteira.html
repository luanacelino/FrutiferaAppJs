<!DOCTYPE html>
<html lang="pt-br">

<head>
  <!-- Definição do charset UTF-8 para suportar caracteres especiais e acentuação -->
  <meta charset="UTF-8">
  
  <!-- Configuração para responsividade em dispositivos móveis -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Título que aparece na aba do navegador -->
  <title>Fruteiras</title>
  
  <!-- Importação do Bootstrap 5.3.3 via CDN -->
  <!-- Framework CSS que fornece componentes prontos (grid, modal, cards, etc) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Toastify CSS: biblioteca para exibir notificações toast (avisos flutuantes) -->
  <!-- Mantido no código caso seja necessário adicionar notificações no futuro -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  
  <!-- CSS customizado para fixar o footer na parte inferior -->
  <style>
    /* Fazer o body ocupar 100% da altura da tela */
    /* Usar flexbox para empurrar o footer para baixo */
    body {
      min-height: 100vh; /* 100% da altura da janela do navegador */
      display: flex;
      flex-direction: column; /* Organiza os elementos em coluna (um abaixo do outro) */
    }
    
    /* O main cresce para ocupar o espaço disponível */
    /* Isso empurra o footer automaticamente para o final da página */
    main {
      flex: 1; /* Cresce para preencher o espaço restante */
    }
  </style>
</head>

<!-- d-flex flex-column min-vh-100: classes Bootstrap alternativas ao CSS acima -->
<!-- Removemos essas classes do body porque já estamos usando CSS customizado -->
<!-- d-flex: ativa o flexbox -->
<!-- flex-column: organiza elementos em coluna (vertical) -->
<!-- min-vh-100: altura mínima de 100% da viewport (tela) -->
<body class="d-flex flex-column min-vh-100">
  <!-- ============================================ -->
  <!-- HEADER: Barra de navegação superior -->
  <!-- ============================================ -->
  <header>
    <!-- Navbar do Bootstrap: barra de navegação responsiva -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        
        <!-- Brand: nome/logo da aplicação -->
        <a class="navbar-brand" href="#">Fruteiras do Brejo Paraibano</a>
        
        <!-- Botão hambúrguer para mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <!-- Menu de navegação -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <!-- Link para Home -->
            <li class="nav-item">
              <a class="nav-link" href="./index.html">Home</a>
            </li>
            <!-- Link Fruteiras: classe 'active' indica que esta é a página atual -->
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./fruteira.html">Fruteiras</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- ============================================ -->
  <!-- MAIN: Conteúdo principal da página -->
  <!-- ============================================ -->
  <!-- container: centraliza o conteúdo com padding lateral -->
  <!-- mt-3: margin-top de 1rem (espaçamento superior) -->
  <!-- flex-grow-1: faz o main crescer e empurrar o footer para baixo -->
  <main class="container mt-3 flex-grow-1">

    <!-- ======================================== -->
    <!-- BOTÃO DE CADASTRO (+) -->
    <!-- ======================================== -->
    <!-- Botão que abre o modal de cadastro de fruteira -->
    <!-- type="button": especifica que é um botão (não submit) -->
    <!-- btn btn-primary: classes Bootstrap para estilizar o botão (azul) -->
    <!-- mb-3: margin-bottom de 1rem (espaçamento inferior) -->
    <!-- data-bs-toggle="modal": indica que o botão abre um modal -->
    <!-- data-bs-target="#modalFruteira": especifica qual modal será aberto (pelo ID) -->
    <button type="button" class="btn btn-primary mb-3" id="botaoAdicionar" 
      data-bs-toggle="modal" data-bs-target="#modalFruteira">+</button>

    <!-- ======================================== -->
    <!-- ÁREA DE LISTAGEM DAS FRUTEIRAS -->
    <!-- ======================================== -->
    <!-- Grid responsivo do Bootstrap para exibir cards de fruteiras -->
    <!-- row: cria uma linha no grid -->
    <!-- row-cols-1: 1 coluna em telas pequenas (mobile) -->
    <!-- row-cols-md-3: 3 colunas em telas médias e grandes (≥768px) -->
    <!-- g-4: gutter (espaçamento) de 1.5rem entre os cards -->
    <!-- id="listagemFruteiras": identificador usado pelo JavaScript para inserir os cards dinamicamente -->
    <div class="row row-cols-1 row-cols-md-3 g-4" id="listagemFruteiras">
      <!-- Os cards das fruteiras serão inseridos aqui dinamicamente pelo JavaScript -->
      <!-- Cada card contém: nome popular, nome científico, produção, data plantio, idade e botão excluir -->
    </div>

  </main>

  <!-- ============================================ -->
  <!-- MODAL: Janela flutuante para cadastro -->
  <!-- ============================================ -->
  <!-- Modal do Bootstrap: janela sobreposta usada para cadastrar fruteiras -->
  <!-- modal fade: classe para efeito de transição suave -->
  <!-- id="modalFruteira": identificador usado pelo botão (+) para abrir este modal -->
  <!-- tabindex="-1": permite navegação por teclado -->
  <!-- aria-labelledby e aria-hidden: atributos de acessibilidade para leitores de tela -->
  <div class="modal fade" id="modalFruteira" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    
    <!-- modal-dialog: container do conteúdo do modal -->
    <div class="modal-dialog">
      
      <!-- modal-content: área branca do modal -->
      <div class="modal-content">
        
        <!-- ======================================== -->
        <!-- CABEÇALHO DO MODAL -->
        <!-- ======================================== -->
        <div class="modal-header">
          <!-- Título do modal -->
          <h1 class="modal-title fs-5" id="tituloModal">Cadastrar Fruteira</h1>
          
          <!-- Botão X para fechar o modal -->
          <!-- btn-close: ícone de fechar do Bootstrap -->
          <!-- data-bs-dismiss="modal": fecha o modal ao clicar -->
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <!-- ======================================== -->
        <!-- FORMULÁRIO DE CADASTRO -->
        <!-- ======================================== -->
        <!-- id="formularioFruteira": usado pelo JavaScript para capturar o evento de submit -->
        <form id="formularioFruteira">
          
          <!-- ======================================== -->
          <!-- CORPO DO MODAL: Campos do formulário -->
          <!-- ======================================== -->
          <div class="modal-body">

            <!-- CAMPO 1: Nome Popular da Fruteira -->
            <!-- mb-3: margin-bottom de 1rem entre campos -->
            <div class="mb-3">
              <!-- Label: texto descritivo do campo -->
              <!-- for="nomePopular": associa o label ao input pelo ID -->
              <label for="nomePopular" class="form-label">Nome da Espécie (Popular)</label>
              
              <!-- Input de texto para o nome popular -->
              <!-- form-control: classe Bootstrap para estilizar inputs -->
              <!-- name e id: identificadores usados pelo JavaScript -->
              <!-- placeholder: texto de exemplo que aparece quando o campo está vazio -->
              <!-- required: campo obrigatório (validação HTML5) -->
              <input type="text" class="form-control" name="nomePopular" id="nomePopular" 
                placeholder="Ex: Mangueira" required>
            </div>

            <!-- CAMPO 2: Nome Científico -->
            <div class="mb-3">
              <label for="nomeCientifico" class="form-label">Nome Científico</label>
              <input type="text" class="form-control" name="nomeCientifico" id="nomeCientifico" 
                placeholder="Ex: Mangifera indica" required>
            </div>

            <!-- CAMPO 3: Produção Média por Safra -->
            <div class="mb-3">
              <label for="producaoMedia" class="form-label">Produção Média por Safra (Kg)</label>
              
              <!-- Input numérico -->
              <!-- type="number": permite apenas números -->
              <!-- min="0": valor mínimo é 0 (não aceita negativos) -->
              <!-- step="0.01": permite decimais (ex: 150.50) -->
              <input type="number" class="form-control" name="producaoMedia" id="producaoMedia" 
                placeholder="Ex: 150" min="0" step="0.01" required>
            </div>

            <!-- CAMPO 4: Data do Plantio -->
            <div class="mb-3">
              <label for="dataPlantio" class="form-label">Data do Plantio</label>
              
              <!-- Input de texto com máscara automática dd/mm/aaaa -->
              <!-- maxlength="10": limita a 10 caracteres (dd/mm/aaaa) -->
              <!-- A máscara é aplicada pelo JavaScript (adiciona as barras automaticamente) -->
              <input type="text" class="form-control" name="dataPlantio" id="dataPlantio" 
                placeholder="dd/mm/aaaa" maxlength="10" required>
            </div>

          </div>
          
          <!-- ======================================== -->
          <!-- RODAPÉ DO MODAL: Botões de ação -->
          <!-- ======================================== -->
          <div class="modal-footer">
            
            <!-- Botão Cancelar: fecha o modal sem salvar -->
            <!-- btn-secondary: botão com cor secundária (cinza) -->
            <!-- data-bs-dismiss="modal": fecha o modal ao clicar -->
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            
            <!-- Botão Salvar: submete o formulário -->
            <!-- type="submit": ao clicar, dispara o evento onsubmit do formulário -->
            <!-- O JavaScript captura este evento para processar o cadastro -->
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
        
      </div>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- FOOTER: Rodapé da página -->
  <!-- ============================================ -->
  <footer class="text-center py-3 mt-5 bg-light">
    <p class="mb-0">© 2026 Fruteiras do Brejo Paraibano</p>
  </footer>

  <!-- ============================================ -->
  <!-- SCRIPTS: Arquivos JavaScript -->
  <!-- ============================================ -->
  
  <!-- Bootstrap JavaScript Bundle -->
  <!-- Necessário para funcionalidade do modal, navbar collapse, etc -->
  <!-- Inclui Popper.js para posicionamento de tooltips e dropdowns -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Toastify JavaScript -->
  <!-- Biblioteca para exibir notificações toast (avisos flutuantes) -->
  <!-- Mantido no código caso seja necessário adicionar notificações no futuro -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <!-- Nosso arquivo JavaScript principal -->
  <!-- type="module": permite usar import/export ES6 (caso necessário no futuro) -->
  <!-- Contém toda a lógica de negócio: cadastro, listagem, exclusão, LocalStorage -->
  <script type="module" src="./src/fruteira.js"></script>
</body>

</html>
