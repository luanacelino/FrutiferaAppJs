<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruteiras</title>
  
  <!-- Bootstrap: framework CSS com componentes prontos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!-- Bootstrap classes para fixar footer no final da página -->
<!-- d-flex flex-column min-vh-100 + flex-grow-1 no main = footer sempre embaixo -->
<body class="d-flex flex-column min-vh-100">
  
  <!-- ========== NAVBAR ========== -->
  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Fruteiras do Brejo Paraibano</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="./index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./fruteira.html">Fruteiras</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- ========== MAIN: Conteúdo principal ========== -->
  <!-- flex-grow-1: faz o main crescer e empurrar o footer para baixo -->
  <main class="container mt-3 flex-grow-1">

    <!-- ========== BOTÃO (+) QUE ABRE O MODAL ========== -->
    <!-- Cadastro acessado através de botão (+) na página de listagem -->
    <!-- data-bs-toggle="modal": indica que abre um modal -->
    <!-- data-bs-target="#modalFruteira": especifica qual modal será aberto -->
    <button type="button" class="btn btn-primary mb-3" id="botaoAdicionar" 
      data-bs-toggle="modal" data-bs-target="#modalFruteira">+</button>

    <!-- ========== ÁREA DE LISTAGEM (Cards Bootstrap) ========== -->
    <!-- Listagem utilizando componente de cartão do Bootstrap -->
    <!-- row-cols-md-3: 3 colunas em telas médias/grandes (responsivo) -->
    <!-- id="listagemFruteiras": JavaScript insere cards aqui dinamicamente -->
    <div class="row row-cols-1 row-cols-md-3 g-4" id="listagemFruteiras">
      <!-- Cards das fruteiras são inseridos aqui via JavaScript -->
    </div>

  </main>

  <!-- ========== MODAL DE CADASTRO ========== -->
  <!-- Botão abre janela modal com formulário -->
  <div class="modal fade" id="modalFruteira" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        
        <!-- Cabeçalho do modal -->
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="tituloModal">Cadastrar Fruteira</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <!-- Formulário com os campos obrigatórios -->
        <!-- id="formularioFruteira": JavaScript captura o submit -->
        <form id="formularioFruteira">
          <div class="modal-body">

            <!--  Nome Popular -->
            <!-- Nome da espécie (popular) -->
            <div class="mb-3">
              <label for="nomePopular" class="form-label">Nome da Espécie (Popular)</label>
              <input type="text" class="form-control" name="nomePopular" id="nomePopular" 
                placeholder="Ex: Mangueira" required>
            </div>

            <!-- Nome Científico -->
            <!-- Nome científico -->
            <div class="mb-3">
              <label for="nomeCientifico" class="form-label">Nome Científico</label>
              <input type="text" class="form-control" name="nomeCientifico" id="nomeCientifico" 
                placeholder="Ex: Mangifera indica" required>
            </div>

            <!-- Produção Média por Safra (Kg) -->
            <!--Produção média por safra (Kg) -->
            <div class="mb-3">
              <label for="producaoMedia" class="form-label">Produção Média por Safra (Kg)</label>
              <input type="number" class="form-control" name="producaoMedia" id="producaoMedia" 
                placeholder="Ex: 150" min="0" step="0.01" required>
            </div>

            <!-- Data do Plantio -->
            <!-- Data do plantio (dd/mm/aaaa) -->
            <!-- maxlength="10": limita a 10 caracteres -->
            <!-- Máscara automática aplicada via JavaScript -->
            <div class="mb-3">
              <label for="dataPlantio" class="form-label">Data do Plantio</label>
              <input type="text" class="form-control" name="dataPlantio" id="dataPlantio" 
                placeholder="dd/mm/aaaa" maxlength="10" required>
            </div>

          </div>
          
          <!-- Rodapé do modal com botões -->
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <!-- type="submit": dispara o evento onsubmit do formulário -->
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
        
      </div>
    </div>
  </div>

  <!-- ========== FOOTER ========== -->
  <footer class="text-center py-3 mt-5 bg-light">
    <p class="mb-0">© 2026 Fruteiras do Brejo Paraibano</p>
  </footer>

  <!-- ========== SCRIPTS ========== -->
  <!-- Bootstrap JS: necessário para modal, navbar, etc -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript principal: lógica de cadastro, listagem, exclusão -->
  <script type="module" src="./src/fruteira.js"></script>
</body>

  </html>
