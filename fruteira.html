<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruteiras</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Toastify CSS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Fruteiras do Brejo Paraibano</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="./index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./fruteira.html">Fruteiras</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  
  <main class="container mt-3">

    <!-- Botão de adicionar: Aciona o modal -->
    <button type="button" class="btn btn-primary mb-3" id="botaoAdicionar" 
      data-bs-toggle="modal" data-bs-target="#modalFruteira">+</button>

    <!-- Listagem em cards -->
    <div class="row row-cols-1 row-cols-md-3 g-4" id="listagemFruteiras">
      <!-- Cards serão inseridos aqui dinamicamente via JavaScript -->
    </div>
    

  </main>
  
<!-- Modal de cadastro de fruteira -->
  <div class="modal fade" id="modalFruteira" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="tituloModal">Cadastrar Fruteira</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="formularioFruteira">
          <div class="modal-body">

            <div class="mb-3">
              <label for="nomePopular" class="form-label">Nome da Espécie (Popular)</label>
              <input type="text" class="form-control" name="nomePopular" id="nomePopular" 
                placeholder="Ex: Mangueira" required>
            </div>

            <div class="mb-3">
              <label for="nomeCientifico" class="form-label">Nome Científico</label>
              <input type="text" class="form-control" name="nomeCientifico" id="nomeCientifico" 
                placeholder="Ex: Mangifera indica" required>
            </div>

            <div class="mb-3">
              <label for="producaoMedia" class="form-label">Produção Média por Safra (Kg)</label>
              <input type="number" class="form-control" name="producaoMedia" id="producaoMedia" 
                placeholder="Ex: 150" min="0" step="0.01" required>
            </div>

            <div class="mb-3">
              <label for="dataPlantio" class="form-label">Data do Plantio</label>
              <input type="text" class="form-control" name="dataPlantio" id="dataPlantio" 
                placeholder="dd/mm/aaaa" maxlength="10" required>
            </div>

          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Toastify -->
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <script type="module" src="..../scr/fruteira.js"></script>
  
    <footer class="text-center py-3 mt-5 bg-light">
    <p class="mb-0">© 2026 Fruteiras do Brejo Paraibano</p>
  </footer>

</body>

</html>
